# Deploys to Google Cloud Run after merge to main.
# Requires GCP sandbox + GitHub Secrets (see docs/DEPLOYMENT_RUNBOOK.md).
# Until secrets are configured, this workflow is skipped automatically.

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AR_REPO: learnsphere
  BACKEND_SERVICE: learnsphere-api
  FRONTEND_SERVICE: learnsphere-web

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_REGION != '' && secrets.GCP_SA_KEY != '' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push backend image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/backend"
          docker build -f Containerfile -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" ./backend
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy backend to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_SA: learnsphere-backend@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
        run: |
          gcloud run deploy "${BACKEND_SERVICE}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/backend:${IMAGE_TAG}" \
            --region="${REGION}" \
            --platform=managed \
            --service-account="${BACKEND_SA}" \
            --add-cloudsql-instances="${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="APP_ENV=production" \
            --set-env-vars="POSTGRES_USER=learnsphere" \
            --set-env-vars="POSTGRES_DB=learnsphere" \
            --set-env-vars="DATABASE_URL=postgresql://learnsphere@/learnsphere?host=/cloudsql/${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-secrets="SECRET_KEY=learnsphere-secret-key:latest,POSTGRES_PASSWORD=learnsphere-db-password:latest" \
            --allow-unauthenticated \
            --port=8080 \
            --quiet

      - name: Get backend URL
        id: backend
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          BACKEND_URL=$(gcloud run services describe "${BACKEND_SERVICE}" \
            --region="${REGION}" \
            --format="value(status.url)")
          echo "url=${BACKEND_URL}" >> "${GITHUB_OUTPUT}"

      - name: Build and push frontend image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/frontend"
          docker build \
            -f Containerfile \
            --build-arg VITE_API_BASE_URL=${{ steps.backend.outputs.url }} \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            ./frontend
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy frontend to Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          gcloud run deploy "${FRONTEND_SERVICE}" \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/frontend:${IMAGE_TAG}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --quiet

      - name: Update backend CORS with frontend URL
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          FRONTEND_URL=$(gcloud run services describe "${FRONTEND_SERVICE}" \
            --region="${REGION}" \
            --format="value(status.url)")
          gcloud run services update "${BACKEND_SERVICE}" \
            --region="${REGION}" \
            --update-env-vars="CORS_ORIGINS=${FRONTEND_URL}" \
            --quiet

      - name: Smoke test
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          curl -sf "${{ steps.backend.outputs.url }}/health"
          FRONTEND_URL=$(gcloud run services describe "${FRONTEND_SERVICE}" \
            --region="${REGION}" \
            --format="value(status.url)")
          curl -sf "${FRONTEND_URL}/health"
