services:
  db:
    image: postgres:16-alpine
    container_name: learnsphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnsphere
      POSTGRES_PASSWORD: learnsphere
      POSTGRES_DB: learnsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnsphere -d learnsphere"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
