services:
  db:
    image: postgres:16-alpine
    container_name: learnsphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnsphere
      POSTGRES_PASSWORD: learnsphere
      POSTGRES_DB: learnsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnsphere -d learnsphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["stack"]
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: learnsphere-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      SECRET_KEY: local-dev-secret-change-me-not-for-production
      POSTGRES_USER: learnsphere
      POSTGRES_PASSWORD: learnsphere
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: learnsphere
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    ports:
      - "8000:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    profiles: ["stack"]
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: learnsphere-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
